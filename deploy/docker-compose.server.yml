services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dreamer-backend:latest
    container_name: dreamer-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/dreamer-backend/dreamer.env
    environment:
      HOST: '127.0.0.1'
      PORT: '3001'
      DATABASE_PATH: /var/lib/dreamer-backend/dreamer.sqlite
    volumes:
      - /var/lib/dreamer-backend:/var/lib/dreamer-backend
