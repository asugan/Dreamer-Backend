# Dreamer Backend compose file (production host, Linux).
# Run a SINGLE instance: SQLite requires single-process ownership. Never `--scale backend=2`.
#
# Usage:
#   cp .env.example .env   # secrets only: DATA_KEY, CLIPROXY_API_KEY, REVENUECAT_SECRET_KEY
#   docker compose up -d --build
#   curl http://127.0.0.1:3001/health
#
# Host network: CLIProxy listens on the host's 127.0.0.1:8317, unreachable from a bridge
# network. The app binds loopback only; the Cloudflare Tunnel / reverse proxy reaches it there,
# so TRUST_PROXY=127.0.0.1 is the real client-IP source. Not usable on Docker Desktop (macOS/Windows).

services:
  backend:
    build: .
    image: dreamer-backend:latest
    container_name: dreamer-backend
    restart: unless-stopped
    network_mode: host
    deploy:
      replicas: 1
    env_file:
      - .env # secrets only; non-secret settings below take precedence
    environment:
      HOST: "127.0.0.1"
      PORT: "3001"
      DATABASE_PATH: "/app/data/dreamer.sqlite"
      TRUST_PROXY: "127.0.0.1"
      CLIPROXY_BASE_URL: "http://127.0.0.1:8317/v1"
      CLIPROXY_MODEL: "gpt-6-luna"
      REVENUECAT_ENTITLEMENT: "dreamer_pro"
      REVENUECAT_MONTHLY_PRODUCT_ID: "monthly"
      ALLOW_SANDBOX: "false"
      DAILY_GENERATION_LIMIT: "200"
    volumes:
      - dreamer-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dreamer-data:
